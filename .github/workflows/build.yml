name: TYROKANJI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TYRO KANJI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract TYRO KANJI project
        run: |
          mkdir -p extracted
          unzip -q TYRO_KANJI_FINAL_PROJECT.zip -d extracted

      - name: Locate Android project
        run: |
          echo "Searching for Android project..."
          find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Detect project directory
        id: project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f -name 'settings.gradle.kts' -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build TYRO KANJI APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "APK files:"
          find extracted -type f -name "*.apk" -print

      - name: Upload TYRO KANJI APK
        uses: actions/upload-artifact@v4
        with:
          name: TYRO-KANJI-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
