name: TYRO KANJI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract YOUR ZIP
      - name: Extract TYRO KANJI project
        shell: bash
        run: |
          set -e

          ZIP_FILE="TYRO_KANJI_SETTINGS_WIDGET_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found!"
            echo "Files in repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."
          echo "Extracted structure:"
          find extracted -maxdepth 3 -type f | sort

      # 3. Find the actual Gradle project
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f -name "settings.gradle" -print -quit)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Set up Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Set up Android
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6. Build APK
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Building from:"
          pwd

          echo "Project files:"
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found. Installing Gradle..."
            gradle :app:assembleDebug --stacktrace
          fi

      # 7. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TYRO-KANJI-DEBUG-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
