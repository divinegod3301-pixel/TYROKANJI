name: TYRO KANJI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract the exact ZIP
      - name: Extract TYRO KANJI project
        shell: bash
        run: |
          set -e

          ZIP_FILE="TYRO_KANJI_SETTINGS_WIDGET_FIXED_BUILDABLE.zip"

          echo "Looking for: $ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            echo "Files currently in repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."
          echo "Extracted project:"
          find extracted -maxdepth 3 -type f | sort

      # 3. Automatically find Gradle project
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts/settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6. Build APK
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "================================"
          echo "Building TYRO KANJI"
          echo "Project: $(pwd)"
          echo "================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle..."
            gradle :app:assembleDebug --stacktrace
          fi

      # 7. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TYRO-KANJI-DEBUG-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
