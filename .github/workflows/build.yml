name: TYRO KANJI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TYRO KANJI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q TYRO_KANJI_BUILD_FIXED_v2.zip -d extracted

      - name: Find Android project
        id: project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f -name 'settings.gradle.kts' -print -quit)")
          echo "Project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TYRO-KANJI-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
