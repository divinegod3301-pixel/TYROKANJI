name: TYRO KANJI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TYRO KANJI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract TYRO KANJI project
        run: |
          mkdir -p extracted
          unzip -q TYRO_KANJI_PROPER_REBUILD.zip -d extracted

      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f -name 'settings.gradle.kts' -print -quit)")
          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Show project files
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Building from:"
          pwd
          echo "Files:"
          ls -la
          echo "MainActivity:"
          find app/src/main/java -name "MainActivity.kt" -print

      - name: Build TYRO KANJI
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Generated APK:"
          find extracted -type f -name "*.apk" -print

      - name: Upload TYRO KANJI APK
        uses: actions/upload-artifact@v4
        with:
          name: TYRO-KANJI-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
